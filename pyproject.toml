[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "py-curve25519-dh"
version = "1.0.0"
description = "X25519 Diffie-Hellman key exchange on Curve25519"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Mahmoud ElNemer", email = "sultanelnemer@gmail.com"}]
keywords = ["python", "curve25519", "diffie-hellman", "cryptography", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ElNeMeR70/py-curve25519-dh"
Repository = "https://github.com/ElNeMeR70/py-curve25519-dh"
